# ============================================================
# configs/config.yaml – Konfigurasi terpusat proyek
# Semua path, seed, dan hyperparameter ada di sini.
# Jangan hardcode nilai apapun di dalam kode src/.
# ============================================================

# --- Reproducibility ---
seed: 42

# --- Path Data ---
paths:
  raw_dir:            "data/raw"
  raw_data_dir:       "data/raw"
  interim_dir:        "data/interim"
  processed_dir:      "data/processed"
  processed_data_dir: "data/processed"
  labeled_dir:        "data/labeled"
  sessions_dir:       "configs/sessions"
  reports_dir:        "reports"
  figures_dir:        "reports/figures"
  tables_dir:         "reports/tables"
  models_dir:         "models"
  logs_dir:           "logs"

  # Kamus & Lexicon
  slang_dict:         "data/interim/slang_dict.json"
  inset_lexicon:      "data/interim/inset_lexicon.tsv"

# --- Platform & Pengaturan Target ---
platforms:
  instagram:
    enabled: true
    tag_url: "https://www.instagram.com/explore/tags/undiksha/"
    session_file: "configs/sessions/instagram_session.json"
  facebook:
    enabled: true
    search_url: "https://www.facebook.com/search/posts/?q=undiksha"
    session_file: "configs/sessions/facebook_session.json"
  threads:
    enabled: true
    search_url: "https://www.threads.net/search?q=%23undiksha"
    session_file: "configs/sessions/threads_session.json"
  tiktok:
    enabled: true
    tag_url: "https://www.tiktok.com/tag/undiksha"
    search_url: "https://www.tiktok.com/search?q=undiksha"
    session_file: "configs/sessions/tiktok_session.json"
  twitter:
    enabled: true
  youtube:
    enabled: true

search_keywords:
  - "Undiksha"
  - "#undiksha"
  - "@undiksha"
  - "Universitas Pendidikan Ganesha"
  - "undiksha singaraja"
  - "undiksha denpasar"
  - "UKT undiksha"
  - "SNBP undiksha"
  - "SNBT undiksha"
  - "mandiri undiksha"
  - "mahasiswa undiksha"
  - "dosen undiksha"
  - "KKN undiksha"
  - "wisuda undiksha"

# --- Aspek Reputasi ---
aspects:
  akademik:
    keywords: ["dosen", "kurikulum", "akreditasi", "ranking", "kelas", "mata kuliah", "ilmu"]
  penerimaan_biaya:
    keywords: ["SNBP", "SNBT", "mandiri", "UKT", "beasiswa", "daftar", "PMB"]
  fasilitas:
    keywords: ["kampus", "perpustakaan", "wifi", "asrama", "kos", "gedung", "lab"]
  layanan_administrasi:
    keywords: ["SIAKAD", "birokrasi", "admin", "pelayanan", "respons", "surat"]
  kemahasiswaan:
    keywords: ["organisasi", "prestasi", "kegiatan", "KKN", "BEM", "UKM", "lomba"]
  lulusan_karier:
    keywords: ["alumni", "kerja", "penyerapan", "lulus", "wisuda", "IPK"]
  isu_citra:
    keywords: ["viral", "berita", "kasus", "kebijakan", "skandal", "reputasi"]

# --- Split Data ---
split:
  test_size: 0.15
  val_size:  0.15
  stratify:  true     # Stratified berdasarkan label sentimen

# --- Label Sentimen ---
labels:
  positif: 1
  netral:  0
  negatif: -1

# --- Preprocessing ---
preprocessing:
  min_token_length: 2
  max_text_length:  512    # Token maksimum untuk BERT
  remove_stopwords: true
  apply_stemming:   true

# --- TF-IDF ---
tfidf:
  max_features: 10000
  ngram_range:  [1, 2]
  sublinear_tf: true

# --- Model ML Klasik ---
classical_models:
  svm:
    kernel: "rbf"
    C: 1.0
    class_weight: "balanced"
    probability: true
  naive_bayes:
    alpha: 1.0
  random_forest:
    n_estimators: 200
    max_depth: null
    class_weight: "balanced"
  xgboost:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "mlogloss"

# --- BERT / IndoBERT ---
bert:
  model_name:        "indobenchmark/indobert-base-p1"
  max_length:        128
  batch_size:        16
  num_epochs:        5
  learning_rate:     2.0e-5
  warmup_ratio:      0.1
  weight_decay:      0.01
  gradient_clip:     1.0
  fp16:              false   # Set true jika GPU mendukung

# --- Ensemble ---
ensemble:
  method:          "stacking"    # "stacking" atau "soft_voting"
  meta_learner:    "logistic_regression"
  cv_folds:        5             # Untuk out-of-fold stacking

# --- SMOTE ---
imbalance:
  method:         "smote"        # "smote", "class_weight", atau "none"
  k_neighbors:    5

# --- Evaluasi ---
evaluation:
  cv_folds:        5
  metrics:
    - accuracy
    - precision_macro
    - recall_macro
    - f1_macro

# --- Pemantauan Isu Mingguan ---
weekly_monitoring:
  window_days: 7
  min_mentions: 5
  raw_dir: "data/raw/weekly"
  input_dir: "data/weekly_input"
  predictions_file: "data/processed/weekly_predictions.parquet"
  issues_file: "data/processed/weekly_issues.csv"
  weights:
    volume: 0.30
    sentiment: 0.45
    growth: 0.25
  thresholds:
    high_alert: 65.0
    medium_alert: 40.0

# --- Logging ---
logging:
  level:   "INFO"    # DEBUG, INFO, WARNING, ERROR
  format:  "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  to_file: true

# ============================================================
# Konfigurasi Pipeline Scraping & Pengolahan Data Multi-Platform
# ============================================================
target_hashtag: "#undiksha"
query_keyword: "undiksha"

scraping:
  default_post_limit: 50
  max_comments_per_post: 50
  headless: false              # Set false agar bisa melihat proses atau saat login awal
  slow_mo: 1000                # Delay milidetik antar aksi (agar natural seperti manusia)
  timeout: 60000               # 60 detik timeout
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
  viewport:
    width: 1280
    height: 800

# Pengaturan Sesi & URL Platform Scraper
platforms_scraper:
  instagram:
    enabled: true
    tag_url: "https://www.instagram.com/explore/tags/undiksha/"
    session_file: "configs/sessions/instagram_session.json"
  facebook:
    enabled: true
    search_url: "https://www.facebook.com/search/posts/?q=undiksha"
    session_file: "configs/sessions/facebook_session.json"
  threads:
    enabled: true
    search_url: "https://www.threads.net/search?q=%23undiksha"
    session_file: "configs/sessions/threads_session.json"
  tiktok:
    enabled: true
    tag_url: "https://www.tiktok.com/tag/undiksha"
    search_url: "https://www.tiktok.com/search?q=undiksha"
    session_file: "configs/sessions/tiktok_session.json"

cleaning:
  remove_urls: true
  remove_mentions: true
  remove_hashtags: false
  remove_emojis: false
  lowercase: false
  min_text_length: 3

sentiment_analysis:
  labeling:
    default_method: "hybrid"    # hybrid (IndoBERT+Leksikon), indobert, lexicon
    model_name: "mdhugol/indonesia-bert-sentiment-classification"
    batch_size: 32
    confidence_threshold: 0.75
    audit_file: "data/processed/undiksha_labeling_audit.xlsx"
  lexicon:
    neutral_threshold: 0.0
    negation_window: 2
    booster_multiplier: 1.6
  modeling:
    default_model: "svm"        # svm, complement_nb, random_forest, logistic_regression, naive_bayes
    class_weight: "balanced"
    test_size: 0.2
    random_state: 42
    models_dir: "models"
  visualization:
    figures_dir: "reports/figures"
    dpi: 300

